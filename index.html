<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theridel Coach</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <header>
        <h1>Theridel Coach Ver 0.3bis.2</h1>
        <p>Benvenuto nella piattaforma di coaching, accedi per gestire il tuo percorso.</p>
    </header>

    <main>
        <button onclick="location.href='adeguamentoContesto.html'">Accedi alla modifica del contesto</button>
        <button onclick="location.href='sviluppoSistema.html'">Accedi al Progetto Sviluppo Sistema</button>
        <section id="aiDirectives">
            <h2>Direttive AI</h2>
            <textarea id="aiInstructions" placeholder="Inserisci qui le istruzioni operative per Bot AI..."></textarea>
            <button onclick="saveAiDirectives()">Salva Direttive</button>
        </section>
    </main>

    <script type="module">
         import { db, openDatabase } from './assets/js/indexedDB.js'; // Importa db e openDatabase
        // Carica i dati salvati quando la pagina si apre
        window.onload = function() {
            document.getElementById('aiInstructions').value = localStorage.getItem('aiInstructions') || '';
        };

        // Funzione per salvare i dati
        function saveAiDirectives() {
            localStorage.setItem('aiInstructions', document.getElementById('aiInstructions').value);
            alert('Direttive AI salvate!');
        }
    </script>
    
</body>

</html>
