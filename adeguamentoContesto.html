<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching con Bot AI - Theridel</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <header>
        <h1>Percorso di coaching con Bot AI</h1>
        <p>Una piattaforma per mantenere il contesto delle conversazioni con Bot AI</p>
    </header>

    <section id="context">
        <h2>Contesto Generale</h2>
        <textarea id="generalContext" placeholder="Inserisci qui gli obiettivi generali del tuo percorso..."></textarea>
        <button onclick="saveContext()">Salva Contesto</button>
    </section>

    <section id="lastSession">
        <h2>Ultima Sessione</h2>
        <textarea id="lastSessionNotes" placeholder="Copia qui le note dall'ultima sessione con Bot AI..."></textarea>
        <button onclick="saveLastSession()">Salva Sessione</button>
        <button onclick="location.href='resocontoSessioni.html'">Vai al Resoconto delle Sessioni</button>
    </section>

    <section id="nextQuestions">
        <h2>Domande per la Prossima Sessione</h2>
        <textarea id="questionsForNext" placeholder="Inserisci le domande per la prossima sessione..."></textarea>
        <button onclick="saveQuestions()">Salva Domande</button>
    </section>

    <section id="exportSection">
        <h2>Esporta Contesto per Bot AI</h2>
        <button onclick="generateExport()">Genera Testo da Copiare</button>
        <div id="exportResult" style="margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px; display: none;">
            <h3>Copia questo testo all'inizio della prossima conversazione con Bot AI:</h3>
            <div id="exportText" style="white-space: pre-wrap; background-color: #eee; padding: 15px; border-radius: 5px;"></div>
            <button onclick="copyToClipboard()" style="margin-top: 10px;">Copia negli Appunti</button>
        </div>
    </section>

    <script type="module">
        import { db, openDatabase } from './assets/js/indexedDB.js';
        // Variabile per il nome del progetto corrente.
        // Per questa pagina, useremo un nome fisso.
        // In futuro, ogni pagina di progetto avrà il suo nome specifico.
        const currentProjectName = "Contesto Generale";

        /**
         * Salva solo le lastSessionNotes in IndexedDB come un nuovo record.
         * @param {string} projectName - Il nome del progetto (per coerenza, anche se non strettamente necessario per questo salvataggio singolo).
         * @param {string} lastSessionNotes - Le note dell'ultima sessione da salvare.
         */
        async function saveLastSessionNotesToIndexedDB(projectName, lastSessionNotes) {
            try {
                if (!db) {
                    await openDatabase(); // Assicurati che il database sia aperto
                }

                // Inizia una transazione di scrittura sull'object store 'sessions'
                const transaction = db.transaction(['sessions'], 'readwrite');
                const objectStore = transaction.objectStore('sessions');

                // Crea un oggetto per il record che include solo le note e i metadati
                const sessionRecord = {
                    projectName: projectName, // Salviamo il nome del progetto
                    timestamp: new Date().toISOString(), // Data e ora attuali in formato ISO
                    lastSessionNotes: lastSessionNotes // Salviamo solo le note specifiche qui
                };

                // Aggiunge il record all'object store.
                // L'ID verrà generato automaticamente grazie a autoIncrement: true.
                const request = objectStore.add(sessionRecord);

                request.onsuccess = () => {
                    console.log('Last Session Notes salvate in IndexedDB:', sessionRecord);
                };

                request.onerror = (event) => {
                    console.error('Errore durante il salvataggio in IndexedDB:', event.target.error);
                };

                // Attendi che la transazione sia completata (successo o errore)
                return new Promise((resolve, reject) => {
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (event) => reject(event.target.error);
                });

            } catch (error) {
                console.error('Errore nella funzione saveLastSessionNotesToIndexedDB:', error);
            }
        }

        /**
         * Recupera il record più recente (con timestamp più alto) da IndexedDB.
         * @returns {Promise<object|null>} - Restituisce l'oggetto record più recente o null se non trovato/errore.
         */
        async function getLatestRecordFromIndexedDB() {
            try {
                if (!db) {
                    // Tenta di aprire il database se non lo è già
                    try {
                        await openDatabase();
                    } catch (error) {
                        console.warn('Impossibile aprire IndexedDB per la lettura:', error);
                        return null; // Restituisce null se non si riesce ad aprire il DB
                    }
                }

                const transaction = db.transaction(['sessions'], 'readonly');
                const objectStore = transaction.objectStore('sessions');
                const index = objectStore.index('timestamp'); // Usiamo l'indice per il timestamp

                // Apri un cursore sull'indice in ordine decrescente per trovare il più recente
                // Range unbounded: va dalla fine all'inizio
                const request = index.openCursor(null, "prev");

                let latestRecord = null;

                request.onsuccess = (event) => {
                    const cursor = event.target.result;
                    if (cursor) {
                        // Il primo record trovato in ordine decrescente è il più recente
                        latestRecord = cursor.value;
                        // Non c'è bisogno di continuare, chiudi il cursore
                        // Il cursor.continue() senza argomenti non chiude implicitamente,
                        // ma leggere il primo elemento e poi non chiamare continue(key)
                        // fa sì che il 'complete' della transazione si attivi dopo questo
                        // successo. Un modo più esplicito sarebbe fermare la transazione
                        // o usare un metodo specifico per prendere l'ultimo, ma il cursore
                        // inverso e prendere il primo è un pattern comune.
                        // Per semplicità e chiarezza per questo caso, prendiamo il primo
                        // e lasciamo che la transazione completi naturalmente.
                    }
                };

                request.onerror = (event) => {
                    console.error('Errore durante la lettura da IndexedDB:', event.target.error);
                };

                // Attendi che la transazione sia completata e poi restituisci il record trovato
                return new Promise((resolve, reject) => {
                    transaction.oncomplete = () => resolve(latestRecord);
                    transaction.onerror = (event) => reject(event.target.error);
                });


            } catch (error) {
                console.error('Errore nella funzione getLatestRecordFromIndexedDB:', error);
                return null; // Restituisce null in caso di errori critici
            }
        }


        // --- Funzioni per localStorage e integrazione IndexedDB ---

        // Carica i dati salvati quando la pagina si apre
        window.onload = async function() {
            document.getElementById('generalContext').value = localStorage.getItem('generalContext') || '';
            document.getElementById('lastSessionNotes').value = localStorage.getItem('lastSessionNotes') || '';
            document.getElementById('questionsForNext').value = localStorage.getItem('questionsForNext') || '';

            // Tenta di aprire il database IndexedDB all'avvio
            try {
                await openDatabase();
            } catch (error) {
                console.warn('Impossibile aprire IndexedDB all\'avvio, procederà solo con localStorage:', error);
            }
        };

        // Funzioni per salvare i dati
        function saveContext() {
            localStorage.setItem('generalContext', document.getElementById('generalContext').value);
            alert('Contesto salvato!');
        }

        async function saveLastSession() {
            const lastSessionNotes = document.getElementById('lastSessionNotes').value;

            // Salva su localStorage
            localStorage.setItem('lastSessionNotes', lastSessionNotes);
            alert('Note dell\'ultima sessione salvate (via localStorage)!');

                      // Ora, salva solo le note specifiche su IndexedDB
            // Controlla se il database è aperto prima di tentare di salvare
            if (db) {
                try {
                    await saveLastSessionNotesToIndexedDB(currentProjectName, lastSessionNotes);
                    alert('Note dell\'ultima sessione salvate (via IndexedDB)!');
                } catch (error) {
                    console.error("Errore durante il salvataggio su IndexedDB:", error);
                    alert('Errore durante il salvataggio delle note su IndexedDB. Controlla la console per i dettagli.');
                }
            } else {
                console.warn("IndexedDB non è disponibile o non è stato aperto, salvataggio solo su localStorage.");
                 alert('IndexedDB non disponibile. Salvataggio effettuato solo su localStorage.');
            }
        }

        function saveQuestions() {
            localStorage.setItem('questionsForNext', document.getElementById('questionsForNext').value);
            alert('Domande salvate!');
        }

        // Genera il testo da copiare per Bot AI
        async function generateExport() { // Resa asincrona per poter attendere la lettura da IndexedDB
            const aiDirectives = localStorage.getItem('aiInstructions') || ''; // Assumendo che le direttive siano in localStorage
            const context = document.getElementById('generalContext').value; // Da localStorage
            const lastSessionLS = document.getElementById('lastSessionNotes').value; // Da localStorage
            const questions = document.getElementById('questionsForNext').value; // Da localStorage

            // Recupera il record più recente da IndexedDB
            let idbRecord = null;
            try {
                idbRecord = await getLatestRecordFromIndexedDB();
            } catch (error) {
                 console.error("Errore nel recupero da IndexedDB per l'export:", error);
            }


            let exportText = "   # CONTESTO PER Bot AI #\n\n"; // Aggiunto a capo per leggibilità

            // Sezioni da localStorage
            exportText += "## Direttive AI ##\n" + aiDirectives + "\n\n";
            exportText += "## Contesto Generale ##\n" + context + "\n\n";
            exportText += "## Ultima Sessione ##\n" + lastSessionLS + "\n\n";
            exportText += "## Domande per questa Sessione ##\n" + questions + "\n\n";

            // Sezione aggiuntiva da IndexedDB (solo Last Session Notes)
            exportText += "## Ultima Sessione (da IndexedDB) ##\n";
             if(idbRecord && idbRecord.lastSessionNotes) { // Controlla se il record esiste e ha le note
                 exportText += "ID: " + idbRecord.id;
                 exportText += "Timestamp: " + idbRecord.timestamp + "\n";
                 exportText += "Note: " + idbRecord.lastSessionNotes + "\n"; // Prende le note dal record
             } else {
                 exportText += "Nessun dato delle ultime sessioni trovato in IndexedDB o errore nel recupero.\n";
             }
            exportText += "\n"; // Aggiunto a capo per separare

            exportText += "### FINE CONTESTO ###\n\n";
            exportText += "Per favore, considera il contesto sopra e aiutami con le domande elencate.";


            document.getElementById('exportText').textContent = exportText;
            document.getElementById('exportResult').style.display = 'block';
        }

        // Copia il testo negli appunti
        function copyToClipboard() {
            const exportText = document.getElementById('exportText').textContent;
            navigator.clipboard.writeText(exportText).then(function() {
                alert('Testo copiato negli appunti!');
            }, function() {
                alert('Errore durante la copia. Prova a selezionare e copiare manualmente.');
            });
        }
    </script>
<button id="backToIndex" onclick="location.href='index.html'">Torna a Index</button>
</body>
</html>
